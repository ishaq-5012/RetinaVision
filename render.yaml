# Render Blueprint: creates the API (FastAPI) and the website (React static site).
# Render dashboard -> New -> Blueprint -> select this repository.
services:
  # ---------- Backend: retinal analysis API ----------
  - type: web
    name: cardiovision-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false # entered in the dashboard, never committed
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b

  # ---------- Frontend: React website ----------
  - type: web
    name: cardiovision
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite # single-page app: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false # https://cardiovision-api.onrender.com (your API URL)
